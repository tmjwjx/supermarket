server:
  http:
    addr: 0.0.0.0:8003
    timeout_ms: 5000
  grpc:
    addr: 0.0.0.0:9003
    timeout_ms: 5000
data:
  database:
    driver: mysql
    source: ${ORDER_DATABASE_SOURCE:root:root@tcp(127.0.0.1:3306)/order?timeout=5s&parseTime=True&loc=Local&charset=utf8mb4}
    debug: true
    auto_migrate: true
client:
  product:
    addr: 127.0.0.1:9001
    timeout_ms: 1000
  inventory:
    addr: 127.0.0.1:9002
    timeout_ms: 1000
  user:
    addr: 127.0.0.1:9000
    timeout_ms: 1000
auth:
  jwt_secret: ${AUTH_JWT_SECRET:change-me-local-jwt-secret}
  admin_jwt_secret: ${ADMIN_JWT_SECRET:change-me-admin-jwt-secret}
