server:
  http:
    addr: 0.0.0.0:8000
    timeout_ms: 1000
  grpc:
    addr: 0.0.0.0:9000
    timeout_ms: 1000
data:
  database:
    driver: mysql
    source: ${USER_DATABASE_SOURCE:root:root@tcp(127.0.0.1:3306)/user?timeout=5s&parseTime=True&loc=Local&charset=utf8mb4}
    # Development conveniences. Keep both false in production and apply schema
    # changes as a separate reviewed step.
    debug: true
    auto_migrate: true
  redis:
    addr: ${REDIS_ADDR:127.0.0.1:6379}
    read_timeout_ms: 200
    write_timeout_ms: 200
auth:
  jwt_secret: ${AUTH_JWT_SECRET:change-me-local-jwt-secret}
  token_expire_ms: 604800000
