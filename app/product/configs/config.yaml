server:
  http:
    addr: 0.0.0.0:8001
    timeout_ms: 1000
  grpc:
    addr: 0.0.0.0:9001
    timeout_ms: 1000
data:
  database:
    driver: mysql
    source: ${PRODUCT_DATABASE_SOURCE:root:root@tcp(127.0.0.1:3306)/product?timeout=5s&parseTime=True&loc=Local&charset=utf8mb4}
    debug: true
    auto_migrate: true
  redis:
    addr: ${REDIS_ADDR:127.0.0.1:6379}
    read_timeout_ms: 200
    write_timeout_ms: 200
auth:
  jwt_secret: ${AUTH_JWT_SECRET:change-me-local-jwt-secret}
  admin_jwt_secret: ${ADMIN_JWT_SECRET:change-me-admin-jwt-secret}
client:
  inventory:
    addr: 127.0.0.1:9002
    timeout_ms: 1000
  order:
    addr: 127.0.0.1:9003
    timeout_ms: 1000
  user:
    addr: 127.0.0.1:9000
    timeout_ms: 1000
