name: ci

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - name: buf
        uses: bufbuild/buf-setup-action@v1
      - run: buf lint
      - run: make api
      - name: generated files are committed
        run: git diff --exit-code
      - run: go build ./...
      # 默认 go test 不连接数据库 数据层测试在 integration 任务里跑
      - run: go test ./...

  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - run: make test-integration
        env:
          TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - run: npm ci && npm test && npm run build
        working-directory: frontend/web

  admin-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - run: npm ci && npm test && npm run build
        working-directory: frontend/admin-web
