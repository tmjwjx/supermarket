name: ci

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - name: buf
        uses: bufbuild/buf-setup-action@v1
      - run: buf lint
      - run: make api
      - name: generated files are committed
        run: git diff --exit-code
      - run: go build ./...
      # 默认 go test 不连接数据库 数据层测试在 integration 任务里跑
      - run: go test ./...

  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - run: make test-integration

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - run: npm ci && npm test && npm run build
        working-directory: frontend/web

  admin-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - run: npm ci && npm test && npm run build
        working-directory: frontend/admin-web

  # PR 只构建镜像 推到默认分支才用 GITHUB_TOKEN 推到 GHCR
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gateway
            context: .
            file: app/gateway/Dockerfile
          - name: user
            context: .
            file: app/user/Dockerfile
          - name: product
            context: .
            file: app/product/Dockerfile
          - name: inventory
            context: .
            file: app/inventory/Dockerfile
          - name: order
            context: .
            file: app/order/Dockerfile
          - name: payment
            context: .
            file: app/payment/Dockerfile
          - name: notification
            context: .
            file: app/notification/Dockerfile
          - name: admin
            context: .
            file: app/admin/Dockerfile
          - name: web
            context: frontend/web
            file: frontend/web/Dockerfile
          - name: admin-web
            context: frontend/admin-web
            file: frontend/admin-web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - id: image
        env:
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ matrix.name }}
          SHA: ${{ github.sha }}
          PUSH: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
        run: |
          owner="${OWNER,,}"
          image="ghcr.io/${owner}/supermarket-${NAME}"
          {
            echo "tags<<EOF"
            echo "${image}:${SHA}"
            if [ "${PUSH}" = "true" ]; then
              echo "${image}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
          tags: ${{ steps.image.outputs.tags }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: false
