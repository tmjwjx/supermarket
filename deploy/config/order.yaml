server:
  http:
    addr: 0.0.0.0:8003
    timeout_ms: 5000
  grpc:
    addr: 0.0.0.0:9003
    timeout_ms: 5000
data:
  database:
    driver: mysql
    source: "root:root@tcp(mysql:3306)/order?timeout=5s&parseTime=True&loc=Local&charset=utf8mb4"
    debug: true
    auto_migrate: true
client:
