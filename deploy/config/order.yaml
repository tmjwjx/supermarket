    addr: product:9001
    timeout_ms: 1000
  inventory:
    addr: inventory:9002
    timeout_ms: 1000
  user:
    addr: user:9000
    timeout_ms: 1000
auth:
  jwt_secret: tmjwjx-user-jwt-secret
  admin_jwt_secret: tmjwjx-admin-jwt-secret
kafka:
  brokers: kafka:29092
