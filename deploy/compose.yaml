name: local

# 开发机和服务器共用这一份编排 不另写第二份
# 只引用已经构建好的镜像 配置挂同目录的 config
services:
  mysql:
    image: mysql:8
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
  # 单节点 KRaft 同一进程兼任 broker 和 controller
  # 9092 给宿主机上的程序 29092 给同一网络里的界面 9093 是控制器 不映射出来
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    # 显式挂载镜像声明的 VOLUME 避免 Docker 再建匿名哈希卷
    # 日志目录指向数据卷 未设置时默认写到容器内临时目录
    volumes:
      - kafka_data:/var/lib/kafka/data
      - kafka_config:/mnt/shared/config
      - kafka_secrets:/etc/kafka/secrets
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: kafka-ui
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
  # 业务镜像不带配置 同目录 config 下的 yaml 挂到容器内 /configs/app.yaml
  # 浏览器入口不绑 127.0.0.1 其余端口只绑本机
  gateway:
    image: ghcr.io/tmjwjx/supermarket-gateway
    container_name: gateway
    volumes:
      - ./config/gateway.yaml:/configs/app.yaml:ro
    ports:
      - "8080:8080"
  user:
    image: ghcr.io/tmjwjx/supermarket-user
    container_name: user
    volumes:
      - ./config/user.yaml:/configs/app.yaml:ro
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:9000:9000"
    depends_on:
      mysql:
        condition: service_healthy
  product:
    image: ghcr.io/tmjwjx/supermarket-product
    container_name: product
    volumes:
      - ./config/product.yaml:/configs/app.yaml:ro
    ports:
      - "127.0.0.1:8001:8001"
      - "127.0.0.1:9001:9001"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
  inventory:
    image: ghcr.io/tmjwjx/supermarket-inventory
    container_name: inventory
    volumes:
      - ./config/inventory.yaml:/configs/app.yaml:ro
    ports:
      - "127.0.0.1:8002:8002"
      - "127.0.0.1:9002:9002"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
  order:
    image: ghcr.io/tmjwjx/supermarket-order
    container_name: order
    volumes:
      - ./config/order.yaml:/configs/app.yaml:ro
    ports:
      - "127.0.0.1:8003:8003"
      - "127.0.0.1:9003:9003"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
  payment:
    image: ghcr.io/tmjwjx/supermarket-payment
    container_name: payment
    volumes:
      - ./config/payment.yaml:/configs/app.yaml:ro
    ports:
      - "127.0.0.1:8004:8004"
      - "127.0.0.1:9004:9004"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
  notification:
    image: ghcr.io/tmjwjx/supermarket-notification
    container_name: notification
    volumes:
      - ./config/notification.yaml:/configs/app.yaml:ro
    ports:
      - "127.0.0.1:8005:8005"
      - "127.0.0.1:9005:9005"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
  admin:
    image: ghcr.io/tmjwjx/supermarket-admin
    container_name: admin
    volumes:
      - ./config/admin.yaml:/configs/app.yaml:ro
    ports:
      - "127.0.0.1:8006:8006"
      - "127.0.0.1:9006:9006"
    depends_on:
      mysql:
        condition: service_healthy
  web:
    image: ghcr.io/tmjwjx/supermarket-web
    container_name: web
    ports:
      - "5174:5174"
  admin-web:
    image: ghcr.io/tmjwjx/supermarket-admin-web
    container_name: admin-web
    ports:
      - "5173:5173"
volumes:
  mysql_data:
  redis_data:
  kafka_data:
  kafka_config:
  kafka_secrets:
