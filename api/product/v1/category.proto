syntax = "proto3";

package product.v1;

import "google/api/annotations.proto";

option go_package = "github.com/tmjwjx/supermarket/api/product/v1;v1";

service CategoryService {
  rpc CreateCategory(CreateCategoryRequest) returns (CreateCategoryResponse) {
    option (google.api.http) = {post: "/v1/admin/categories" body: "*"};
  }
  rpc UpdateCategory(UpdateCategoryRequest) returns (UpdateCategoryResponse) {
    option (google.api.http) = {patch: "/v1/admin/categories/{id}" body: "*"};
  }
  rpc DeleteCategory(DeleteCategoryRequest) returns (DeleteCategoryResponse) {
    option (google.api.http) = {delete: "/v1/admin/categories/{id}"};
  }
  rpc ListCategories(ListCategoriesRequest) returns (ListCategoriesResponse) {
    option (google.api.http) = {get: "/v1/categories"};
  }
  rpc AdminListCategories(AdminListCategoriesRequest) returns (AdminListCategoriesResponse) {
    option (google.api.http) = {get: "/v1/admin/categories"};
  }
}

message Category {
  string id = 1;
  string parent_id = 2;
  string name = 3;
  string icon_url = 4;
  int32 sort = 5;
  bool visible = 6;
  string attribute_template_id = 7;
  repeated Category children = 8;
}

message CreateCategoryRequest {
  string parent_id = 1;
  string name = 2;
  string icon_url = 3;
  int32 sort = 4;
  bool visible = 5;
  string attribute_template_id = 6;
}
message CreateCategoryResponse { Category category = 1; }
message UpdateCategoryRequest {
  string id = 1;
  optional string name = 2;
  optional string icon_url = 3;
  optional int32 sort = 4;
  optional bool visible = 5;
  optional string attribute_template_id = 6;
}
message UpdateCategoryResponse { Category category = 1; }
message DeleteCategoryRequest { string id = 1; }
message DeleteCategoryResponse {}
message ListCategoriesRequest {}
message ListCategoriesResponse { repeated Category categories = 1; }
message AdminListCategoriesRequest {}
message AdminListCategoriesResponse { repeated Category categories = 1; }
